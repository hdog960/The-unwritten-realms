name: Publish The Unwritten Realms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check game rules
        run: npm test

      - name: Verify the exact tested Pages artifact
        run: |
          test -s dist/index.html
          test -s dist/narration.js
          test -s dist/ai-safety.js
          node scripts/build-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          for i in {1..24}; do
            count=$(gh api "repos/$GH_REPO/actions/runs/$GH_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length' || echo 0)
            if [[ "$count" == "1" ]]; then
              echo "Pages artifact indexed"
              sleep 10
              exit 0
            fi
            if [[ "$count" != "0" ]]; then
              echo "::error::Expected exactly one Pages artifact, got $count"
              exit 1
            fi
            echo "Waiting for artifact indexing ($i)"
            sleep 5
          done
          echo "::error::Pages artifact not discoverable"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
