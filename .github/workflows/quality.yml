name: Unwritten Realms PR Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unwritten-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check game.js
          node --check app.js
          node --check ai-worker.js
          node --check sw.js
      - name: Run all engine, save and UI contract tests
        run: npm test

  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test 390x844 mobile interaction and offline shell
        run: node tests/browser-smoke.mjs
